<?xml version="1.0" encoding="UTF-8"?>
<!--
  Play Store icon, 512x512.

  A faithful redraw of the adaptive icon in res/mipmap-anydpi-v26/ic_launcher.xml
  — same 108-unit viewport, same paths, same gradients — so the store listing and
  the installed launcher icon are the same mark rather than two things that
  resemble each other.

  Rendered square and unmasked: Play applies its own rounding, and the artwork
  already sits inside the 66-unit adaptive safe zone, so nothing can clip.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 108 108">
  <defs>
    <radialGradient id="glow" cx="54" cy="48" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D99A5B" stop-opacity="0.149"/>
      <stop offset="1" stop-color="#D99A5B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="54" y1="24" x2="54" y2="66.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3BE79"/>
      <stop offset="0.55" stop-color="#DD9A55"/>
      <stop offset="1" stop-color="#C4762F"/>
    </linearGradient>
  </defs>

  <!-- Paper at night: the Night palette's canvas, not pure black. -->
  <rect width="108" height="108" fill="#0D0C0B"/>
  <rect width="108" height="108" fill="url(#glow)"/>

  <!-- The ember. -->
  <path d="M54,24C54,24 69,41 69,51.5C69,59.8 62.3,66.5 54,66.5C45.7,66.5 39,59.8 39,51.5C39,41 54,24 54,24Z" fill="url(#ember)"/>

  <!-- The page it burns on: left leaf, then the right leaf turned from the light. -->
  <path d="M26,69.5C35,68.1 46,69.7 53,73.5L53,84C46,80.2 35,78.6 26,80Z" fill="#EDE6D9" fill-opacity="0.82"/>
  <path d="M82,69.5C73,68.1 62,69.7 55,73.5L55,84C62,80.2 73,78.6 82,80Z" fill="#EDE6D9" fill-opacity="0.58"/>
</svg>
